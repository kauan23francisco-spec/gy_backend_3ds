<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Página Não Encontrada</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background-color: #1e293b;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #38bdf8;
    }
    nav a {
      color: #94a3b8;
      text-decoration: none;
      margin-left: 1.5rem;
      font-size: 1.1rem;
    }
    nav a:hover {
      color: #38bdf8;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-size: 6rem;
      font-weight: bold;
      color: #ef4444;
      line-height: 1;
    }
    h1 {
      font-size: 2rem;
      margin: 1rem 0;
    }
    p {
      color: #94a3b8;
      margin-bottom: 2rem;
    }
    .btn {
      background-color: #0284c7;
      color: white;
      padding: 0.8rem 1.8rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
    .btn:hover {
      background-color: #0369a1;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">⚡ TechZone</div>
    <nav>
      <a href="/">Início</a>
      <a href="/compras">Compras</a>
    </nav>
  </header>

  <main>
    <div class="error-code">404</div>
    <h1>Ops! Página não encontrada</h1>
    <p>A rota que você tentou acessar não existe ou foi movida.</p>
    <a href="/" class="btn">Voltar para a Página Inicial</a>
  </main>

</body>
</html>
