<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - HubMúsica</title>
    <!-- Link para o CSS exclusivo do Login -->
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div class="container-app">
        <!-- Barra Lateral Fixa -->
        <aside class="sidebar">
            <div class="logo">🎵 HubMúsica</div>
            <nav class="menu-nav">
                <a href="/">🏠 Início</a>
                <a href="/buscar">🔍 Buscar</a>
                <a href="/curtidas">📚 Sua Biblioteca</a>
                <a href="/login">👤 Entrar</a>
            </nav>
        </aside>

        <!-- Conteúdo Principal - Área do Formulário -->
        <main class="conteudo-principal">
            <div class="login-box">
                <!-- Cabeçalho do Formulário -->
                <h2>Entrar no HubMúsica</h2>
                
                <form>
                    <!-- Campo de Usuário -->
                    <label class="label-input">E-mail ou nome de usuário</label>
                    <input type="text" class="input-field" placeholder="E-mail ou nome de usuário" required>
                    
                    <!-- Campo de Senha -->
                    <label class="label-input">Senha</label>
                    <input type="password" class="input-field" placeholder="Senha" required>
                    
                    <!-- Botão de Acesso Verde Spotify -->
                    <button type="submit" class="login-btn">Entrar</button>
                </form>

                <!-- Links Utilitários Fictícios -->
                <div class="login-footer">
                    <a href="#">Esqueceu sua senha?</a>
                    <p>Não tem uma conta? <a href="#">Inscreva-se no HubMúsica</a></p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
