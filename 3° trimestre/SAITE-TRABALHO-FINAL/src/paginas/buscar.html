<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Devify - Buscar</title>
    <link rel="stylesheet" href="/css/comum.css">
    <link rel="stylesheet" href="/css/buscar.css">
</head>
<body>
    <div class="container-principal">
        <nav class="barra-lateral">
            <div class="logo">Devify</div>
            <div class="menu-grupo">
                <a href="/">🏠 Início</a>
                <a href="/buscar">🔍 Buscar</a>
                <a href="/curtidas">💚 Músicas Curtidas</a>
                <a href="/login">👤 Login</a>
            </div>
        </nav>
        <main class="conteudo">
            <div class="cabecalho-busca">
                <input type="text" class="campo-busca" placeholder="O que você quer ouvir hoje?">
            </div>
            <section class="secao-generos">
                <h2>Navegar por todas as seções</h2>
                <div class="grid-generos">
                    <div class="card-genero b1"><h3>Podcasts</h3></div>
                    <div class="card-genero b2"><h3>Sertanejo</h3></div>
                    <div class="card-genero b3"><h3>Pop</h3></div>
                    <div class="card-genero b4"><h3>Hip-Hop</h3></div>
                    <div class="card-genero b5"><h3>Rock</h3></div>
                    <div class="card-genero b6"><h3>Dance / Eletrônica</h3></div>
                </div>
            </section>
        </main>
    </div>
    <footer class="player-inferior">
        <div class="player-musica-info">
            <div class="player-capa">⚡</div>
            <div class="player-texto"><h4>Code Track #12</h4><p>Synth Wave Dev</p></div>
        </div>
        <div class="player-controles">
            <div class="botoes-midia"><span>🔀</span><span>⏮️</span><div class="botao-play">▶</div><span>⏭️</span><span>🔁</span></div>
            <div class="barra-progresso-container"><span>1:24</span><div class="barra-fundo"><div class="barra-preenchida"></div></div><span>3:45</span></div>
        </div>
        <div class="player-volume"><span>🔊</span><div class="barra-volume"><div class="volume-preenchido"></div></div></div>
    </footer>
</body>
</html>
