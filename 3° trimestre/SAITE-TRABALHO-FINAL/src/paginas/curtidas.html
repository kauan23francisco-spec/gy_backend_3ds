<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Biblioteca - HubMúsica</title>
    <!-- Link para o CSS exclusivo da Biblioteca -->
    <link rel="stylesheet" href="/css/curtidas.css">
</head>
<body>
    <div class="container-app">
        <!-- Barra Lateral Fixa -->
        <aside class="sidebar">
            <div class="logo">🎵 HubMúsica</div>
            <nav class="menu-nav">
                <a href="/">🏠 Início</a>
                <a href="/buscar">🔍 Buscar</a>
                <a href="/curtidas">📚 Sua Biblioteca</a>
                <a href="/login">👤 Entrar</a>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="conteudo-principal">
            <h1>Sua Biblioteca</h1>
            <h2>Playlists</h2>
            
            <!-- Grid de Cards da Biblioteca -->
            <div class="grid-cards">
                <!-- Card Premium de Músicas Curtidas -->
                <div class="card-curtidas">
                    <div class="container-imagem-abstrata">
                        <!-- Ícone de Coração em Vetor com Ondas de Áudio Circulares -->
                        <svg viewBox="0 0 100 100" xmlns="http://w3.org">
                            <circle cx="50" cy="50" r="44" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.15"/>
                            <circle cx="50" cy="50" r="36" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.25"/>
                            <!-- Desenho do Coração Central -->
                            <path d="M 50 37 C 42 20, 15 25, 15 47 C 15 65, 38 78, 50 86 C 62 78, 85 65, 85 47 C 85 25, 58 20, 50 37 Z" fill="#ffffff"/>
                        </svg>
                    </div>
                    <div class="card-info">
                        <span class="card-title">Músicas Curtidas</span>
                        <span class="card-description">Sua playlist de músicas favoritas</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
